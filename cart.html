<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - ShopEase</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="address-selector.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Manrope', sans-serif; background: radial-gradient(circle at 8% 12%, rgba(45,91,255,.16), transparent 28rem), radial-gradient(circle at 92% 72%, rgba(0,219,233,.08), transparent 24rem), #11131c; color: #e1e1ef; }
    h1, h2, h3, .brand { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel { background: rgba(26, 29, 41, .72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.1); }
    .glow-button { box-shadow: 0 0 20px rgba(45,91,255,.3); transition: .3s ease; }
    .glow-button:hover { box-shadow: 0 0 30px rgba(45,91,255,.5); transform: translateY(-2px); }
    .empty-state { min-height: 360px; }
    main { animation: page-in .65s cubic-bezier(.2,.8,.2,1) both; }
    header { animation: nav-drop .55s ease both; }
    .cart-summary { animation: panel-in .7s .18s cubic-bezier(.2,.8,.2,1) both; }
    .cart-item { animation: item-in .5s cubic-bezier(.2,.8,.2,1) both; }
    .cart-item:nth-child(2) { animation-delay: .08s; }
    .cart-item:nth-child(3) { animation-delay: .16s; }
    .cart-item:nth-child(4) { animation-delay: .24s; }
    .cart-item.bump { animation: bump .35s ease; }
    .cart-item img { transition: transform .35s ease; }
    .cart-item:hover img { transform: scale(1.06) rotate(-2deg); }
    @keyframes page-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes nav-drop { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes panel-in { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes item-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bump { 50% { transform: scale(1.02); border-color: rgba(184,195,255,.7); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    .step-line { height: 1px; background: linear-gradient(90deg, #b8c3ff 0 35%, #434656 35%); }
    .status-chip { background: rgba(0,219,233,.08); border: 1px solid rgba(0,219,233,.25); }
    .back-button { display: inline-flex; align-items: center; gap: .55rem; border: 1px solid rgba(184,195,255,.35); border-radius: .75rem; padding: .7rem 1rem; color: #c4c5d9; background: rgba(26,29,41,.7); box-shadow: 0 4px 14px rgba(0,0,0,.14); transition: transform .25s ease, border-color .25s ease, color .25s ease, background .25s ease; }
    .back-button:hover { transform: translateY(-2px); border-color: #b8c3ff; color: #fff; background: rgba(45,91,255,.16); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b border-[#434656]/20 bg-[#11131c]/85 backdrop-blur-md">
    <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-4 md:px-16">
      <a href="index.html" class="brand text-lg font-extrabold tracking-tight text-white">◒ SHOPEASE</a>
      <nav class="hidden items-center gap-8 text-sm text-[#c4c5d9] md:flex"><a href="index.html#home" class="hover:text-[#b8c3ff]">Home</a><a href="index.html#products" class="hover:text-[#b8c3ff]">Products</a><a href="index.html#categories" class="hover:text-[#b8c3ff]">Categories</a></nav>
      <div class="flex items-center gap-3 text-[#b8c3ff]" aria-label="Shopping cart"><span class="text-2xl">🛒</span><span id="headerCount" class="rounded-full bg-[#2d5bff] px-2 py-0.5 text-xs font-bold text-white">0</span></div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-grow px-5 py-12 md:px-16 md:py-20">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-5"><div class="flex items-center gap-4"><a href="index.html#products" class="back-button text-sm font-semibold" aria-label="Back to products"><span aria-hidden="true">←</span><span>Back to products</span></a><div><p class="mb-1 font-mono text-xs uppercase tracking-[.18em] text-[#00dbe9]">ShopEase / Checkout</p><h1 class="text-3xl font-bold text-white md:text-4xl">Your cart</h1></div></div><span class="status-chip rounded-full px-4 py-2 text-xs font-semibold text-[#7df4ff]">● Ready to review</span></div>
    <div class="mb-8 hidden max-w-xl items-center gap-3 text-xs font-semibold text-[#c4c5d9] sm:flex"><span class="text-[#b8c3ff]">01 Cart</span><span class="step-line flex-1"></span><span>02 Payment</span><span class="step-line flex-1 opacity-40"></span><span>03 Complete</span></div>
    <div class="flex flex-col gap-6 lg:flex-row lg:gap-12"><section id="cartItems" class="flex flex-1 flex-col gap-4" aria-live="polite"></section><aside class="w-full lg:max-w-md"><div class="cart-summary glass-panel rounded-2xl p-6 lg:sticky lg:top-28">
      <div class="mb-7 flex gap-2"><input id="promoCode" class="min-w-0 flex-1 rounded-xl border-0 bg-[#191b24] px-4 py-3 text-sm text-white placeholder:text-[#8e90a2] focus:ring-1 focus:ring-[#2d5bff]" placeholder="Promo code" type="text" /><button id="applyPromo" class="rounded-xl bg-[#2d5bff] px-5 py-3 text-sm font-semibold text-white glow-button" type="button">Apply</button></div>
      <div class="mb-6 flex flex-col gap-4 border-b border-[#434656]/30 pb-6 text-sm"><div class="flex justify-between"><span class="text-[#c4c5d9]">Cart total</span><span id="cartTotal" class="font-semibold text-white">₹0</span></div><div class="flex justify-between"><span class="text-[#c4c5d9]">Tax</span><span id="tax" class="font-semibold text-white">₹0</span></div><div class="flex justify-between"><span class="text-[#c4c5d9]">Delivery</span><span id="delivery" class="font-semibold text-white">₹0</span></div><div class="flex justify-between"><span class="text-[#c4c5d9]">Promo discount</span><span id="discount" class="font-semibold text-[#00dbe9]">- ₹0</span></div></div>
      <div class="mb-8 flex items-center justify-between"><span class="text-lg text-[#c4c5d9]">Subtotal</span><span id="subtotal" class="text-2xl font-bold text-white">₹0</span></div><button id="checkout" class="w-full rounded-xl bg-[#2d5bff] py-4 text-lg font-semibold text-white glow-button" type="button">Proceed to checkout</button><p id="checkoutMessage" class="mt-3 text-center text-sm text-[#00dbe9]" role="status"></p>
    </div></aside></div>
  </main>
  <footer class="border-t border-[#434656]/20 bg-[#0c0e17] px-5 py-7 text-center text-sm text-[#8e90a2]">© 2026 ShopEase. Secure checkout for your everyday tech.</footer>
  <script>
    const cartKey = 'shopease_cart';
    const cartItemsEl = document.getElementById('cartItems');
    const currency = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    let promoApplied = false;

    async function syncCartToBackend() {
      const cart = getCart();
      try {
        const response = await fetch('/api/cart', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart })
        });
        if (response.status === 401) return;
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to save cart to your account');
      } catch (error) {
        console.warn('Could not sync cart to backend', error);
      }
    }

    function getCart() { return JSON.parse(localStorage.getItem(cartKey) || '[]'); }
    function formatPrice(value) { return currency.format(value); }
    async function saveCart(cart) { localStorage.setItem(cartKey, JSON.stringify(cart)); renderCart(); await syncCartToBackend(); }
    function renderCart() {
      const cart = getCart();
      const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const tax = Math.round(total * .05), delivery = total > 0 ? 99 : 0, discount = promoApplied ? Math.round(total * .1) : 0;
      document.getElementById('headerCount').textContent = itemCount;
      document.getElementById('cartTotal').textContent = formatPrice(total);
      document.getElementById('tax').textContent = formatPrice(tax);
      document.getElementById('delivery').textContent = delivery ? formatPrice(delivery) : 'Free';
      document.getElementById('discount').textContent = '- ' + formatPrice(discount);
      document.getElementById('subtotal').textContent = formatPrice(total + tax + delivery - discount);
      if (!cart.length) { cartItemsEl.innerHTML = '<div class="glass-panel empty-state flex flex-col items-center justify-center rounded-2xl p-8 text-center"><div class="mb-4 text-5xl">🛍️</div><h2 class="mb-2 text-2xl font-bold text-white">Your cart is empty</h2><p class="mb-6 text-[#c4c5d9]">Add something you love from the product collection.</p><a href="index.html#products" class="rounded-xl bg-[#2d5bff] px-6 py-3 font-semibold text-white glow-button">Continue shopping</a></div>'; return; }
      cartItemsEl.innerHTML = cart.map((item, index) => `<article class="cart-item glass-panel relative flex items-center gap-4 rounded-2xl p-4"><img class="h-24 w-24 shrink-0 rounded-xl object-cover" src="${item.image}" alt="${item.name}" /><div class="min-w-0 flex-1"><p class="mb-1 text-lg font-semibold text-white">${item.name}</p><p class="font-semibold text-[#b8c3ff]">${formatPrice(item.price)}</p><div class="mt-3 flex w-fit items-center gap-4 rounded-lg border border-[#434656]/50 bg-[#191b24] px-2 py-1"><button class="text-lg hover:text-[#b8c3ff]" data-action="decrease" data-index="${index}" aria-label="Decrease quantity">−</button><span class="min-w-4 text-center text-sm font-semibold">${item.quantity}</span><button class="text-lg hover:text-[#b8c3ff]" data-action="increase" data-index="${index}" aria-label="Increase quantity">+</button></div></div><div class="self-start text-right"><p class="font-semibold text-white">${formatPrice(item.price * item.quantity)}</p><button class="mt-4 text-sm text-[#ffb4ab] hover:text-white" data-action="remove" data-index="${index}">Remove</button></div></article>`).join('');
    }
    cartItemsEl.addEventListener('click', async event => { const button = event.target.closest('button[data-action]'); if (!button) return; const cart = getCart(), index = Number(button.dataset.index); if (button.dataset.action === 'increase') cart[index].quantity += 1; if (button.dataset.action === 'decrease') cart[index].quantity -= 1; if (button.dataset.action === 'remove' || cart[index].quantity < 1) cart.splice(index, 1); await saveCart(cart); const updatedItem = cartItemsEl.children[index]; if (updatedItem) { updatedItem.classList.remove('bump'); void updatedItem.offsetWidth; updatedItem.classList.add('bump'); } });
    document.getElementById('applyPromo').addEventListener('click', () => { if (document.getElementById('promoCode').value.trim()) { promoApplied = true; renderCart(); } });
    document.getElementById('checkout').addEventListener('click', () => { if (getCart().length) window.location.href = 'payment.html'; else document.getElementById('checkoutMessage').textContent = 'Add an item before checkout.'; });
    renderCart();
  </script>
</body>
</html>
