<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - ShopEase</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="address-selector.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'DM Sans', sans-serif; background: #f4f7fb; }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    .page-glow { background: radial-gradient(circle at 80% 0%, rgba(37, 99, 235, .16), transparent 32%), linear-gradient(135deg, #0b1120 0%, #172554 100%); }
    .order-card { animation: rise-in .45s ease both; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .timeline-line { background: linear-gradient(90deg, #2563eb var(--progress), #dbe4f0 var(--progress)); }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <nav class="sticky top-0 z-50 page-glow text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 lg:px-8">
      <a href="index.html" class="flex items-center gap-3 text-lg font-bold tracking-[.2em]">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-500 text-sm tracking-normal">S</span>
        SHOPEASE
      </a>
      <div class="flex items-center gap-3 text-sm">
        <a href="index.html" class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/10 hover:text-white">Continue shopping</a>
        <a href="profile.html" class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/10 hover:text-white">Profile</a>
        <a href="cart.html" class="rounded-full border border-white/20 px-4 py-2 transition hover:border-blue-300 hover:bg-white/10">Cart</a>
      </div>
    </div>
  </nav>
  <header class="page-glow text-white">
    <div class="mx-auto max-w-7xl px-5 pb-14 pt-10 lg:px-8">
      <p class="text-xs font-semibold uppercase tracking-[.28em] text-blue-200">Account center</p>
      <div class="mt-4 flex flex-col justify-between gap-5 md:flex-row md:items-end">
        <div>
          <h1 class="text-4xl font-bold tracking-tight md:text-5xl">Your orders</h1>
          <p id="welcomeText" class="mt-3 max-w-xl text-base text-slate-300">Every delivery, in one calm view.</p>
        </div>
        <a href="index.html#products" class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-500 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-950/30 transition hover:bg-blue-400">Shop new products <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-8 lg:px-8">
    <section class="grid gap-4 sm:grid-cols-3" aria-label="Order summary">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Total orders</p><p id="totalCount" class="mt-2 text-3xl font-bold text-slate-900">0</p></div>
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">On the way</p><p id="activeCount" class="mt-2 text-3xl font-bold text-blue-600">0</p></div>
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Completed</p><p id="completedCount" class="mt-2 text-3xl font-bold text-emerald-600">0</p></div>
    </section>

    <section class="mt-8 flex flex-col gap-4 border-b border-slate-200 pb-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Order history</h2>
        <p class="mt-1 text-sm text-slate-500">Track deliveries and manage returns from one page.</p>
      </div>
      <label class="relative block"><span class="sr-only">Filter orders</span><select id="statusFilter" class="w-full rounded-xl border-slate-300 bg-white py-2.5 pl-4 pr-10 text-sm font-medium text-slate-700 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:w-48"><option value="All">All orders</option><option value="Active">Active delivery</option><option value="Delivered">Delivered</option><option value="Service">Returns & refunds</option></select></label>
    </section>

    <section id="ordersList" class="mt-6 grid gap-5 lg:grid-cols-2" aria-live="polite"></section>
  </main>

  <script>
    const list = document.getElementById('ordersList');
    const filter = document.getElementById('statusFilter');
    const statuses = ['Packed', 'Dispatched', 'Out for Delivery', 'Delivered'];
    const activeStatuses = new Set(['Packed', 'Dispatched', 'Out for Delivery']);
    const serviceStatuses = new Set(['Return Requested', 'Replacement Requested', 'Refund Processing', 'Refunded', 'Returned']);
    let orders = [];

    const statusStyles = {
      Packed: 'bg-sky-50 text-sky-700 ring-sky-200', Dispatched: 'bg-indigo-50 text-indigo-700 ring-indigo-200',
      'Out for Delivery': 'bg-amber-50 text-amber-700 ring-amber-200', Delivered: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
      'Return Requested': 'bg-pink-50 text-pink-700 ring-pink-200', 'Replacement Requested': 'bg-orange-50 text-orange-700 ring-orange-200',
      'Refund Processing': 'bg-red-50 text-red-700 ring-red-200', Refunded: 'bg-rose-50 text-rose-700 ring-rose-200', Returned: 'bg-cyan-50 text-cyan-700 ring-cyan-200'
    };

    function statusClass(status) { return statusStyles[status] || 'bg-slate-50 text-slate-700 ring-slate-200'; }
    function progress(status) {
      if (serviceStatuses.has(status)) return 100;
      const index = statuses.indexOf(status);
      return index < 0 ? 0 : Math.max(8, (index / (statuses.length - 1)) * 100);
    }
    function filterOrders() {
      const value = filter.value;
      return orders.filter(order => value === 'All' || (value === 'Active' && activeStatuses.has(order.status)) || (value === 'Delivered' && order.status === 'Delivered') || (value === 'Service' && serviceStatuses.has(order.status)));
    }
    function renderSummary() {
      document.getElementById('totalCount').textContent = orders.length;
      document.getElementById('activeCount').textContent = orders.filter(order => activeStatuses.has(order.status)).length;
      document.getElementById('completedCount').textContent = orders.filter(order => order.status === 'Delivered' || serviceStatuses.has(order.status)).length;
    }
    function render() {
      const visible = filterOrders();
      renderSummary();
      if (!visible.length) {
        list.innerHTML = `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-12 text-center lg:col-span-2"><div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-50 text-2xl text-blue-600">⌁</div><h3 class="mt-5 text-xl font-bold text-slate-900">No orders in this view</h3><p class="mt-2 text-sm text-slate-500">Your purchases and their delivery updates will appear here.</p><a href="index.html#products" class="mt-5 inline-flex rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white">Browse products</a></div>`;
        return;
      }
      list.innerHTML = visible.map((order, cardIndex) => {
        const items = order.items || [];
        const names = items.map(item => item.name).join(', ') || 'ShopEase purchase';
        const currentIndex = statuses.indexOf(order.status);
        const summarySteps = serviceStatuses.has(order.status) ? ['Delivered', order.status] : statuses;
        const paymentLabel = order.paymentMethod === 'Cash on delivery' && order.paymentStatus === 'pending'
          ? 'Order placed · Pay on delivery'
          : order.paymentMethod === 'Razorpay' && order.paymentStatus === 'paid' && order.razorpayPaymentId
            ? 'Paid securely'
            : 'Payment not completed';
        const paymentLabelClass = paymentLabel === 'Payment not completed' ? 'text-rose-600' : 'text-emerald-700';
        return `<article class="order-card overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm" style="animation-delay:${cardIndex * 70}ms">
          <div class="border-b border-slate-100 p-5">
            <div class="flex items-start justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-[.16em] text-slate-400">${order.id}</p><h3 class="mt-2 line-clamp-2 text-lg font-bold text-slate-900">${names}</h3></div><span class="shrink-0 rounded-full px-3 py-1.5 text-xs font-bold ring-1 ${statusClass(order.status)}">${order.status}</span></div>
            <div class="mt-5 flex items-center gap-2" aria-label="Order progress"><span class="h-2 w-2 rounded-full bg-blue-600"></span><div class="timeline-line h-1.5 flex-1 rounded-full" style="--progress:${progress(order.status)}%"></div><span class="h-2 w-2 rounded-full ${order.status === 'Delivered' || serviceStatuses.has(order.status) ? 'bg-blue-600' : 'bg-slate-200'}"></span></div>
            <div class="mt-2 flex justify-between text-[11px] font-semibold uppercase tracking-wider text-slate-400"><span>Placed</span><span>${serviceStatuses.has(order.status) ? 'After delivery care' : order.status}</span></div>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-50/70 px-5 py-4 text-sm"><div><p class="text-slate-400">Order total</p><p class="mt-1 font-bold text-slate-900">₹${Number(order.total || 0).toLocaleString('en-IN')}</p></div><div><p class="text-slate-400">Payment</p><p class="mt-1 font-semibold ${paymentLabelClass}">${paymentLabel}</p></div></div>
          <div class="flex items-center justify-between gap-3 p-5"><p class="text-xs text-slate-500">${new Date(order.createdAt || Date.now()).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</p><a href="order-details.html?id=${encodeURIComponent(order.id)}" class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-blue-600">View tracking <span aria-hidden="true">→</span></a></div>
        </article>`;
      }).join('');
    }
    async function loadOrders() {
      const email = localStorage.getItem('shopease_user_email');
      document.getElementById('welcomeText').textContent = email ? `Tracking updates for ${email}` : 'Sign in to see your purchases and delivery updates.';
      try {
        if (!email) throw new Error('Not signed in');
        const response = await fetch(`/api/orders?email=${encodeURIComponent(email)}`);
        if (!response.ok) throw new Error('Unable to load orders');
        orders = (await response.json()).orders || [];
      } catch (error) {
        orders = JSON.parse(localStorage.getItem('shopease_orders') || '[]');
      }
      render();
    }
    filter.addEventListener('change', render);
    loadOrders();
  </script>
</body>
</html>
